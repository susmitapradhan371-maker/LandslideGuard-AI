<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LandslideGuard AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1b5e20;
        }

        p {
            text-align: center;
            color: #555;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌍 LandslideGuard AI</h1>

    <p>Landslide Risk Prediction System</p>

    <form method="POST">

        <label>Rainfall (mm/day)</label>
        <input type="number" step="any" name="rainfall" required>

        <label>Soil Moisture (%)</label>
        <input type="number" step="any" name="soil_moisture" required>

        <label>Slope (degrees)</label>
        <input type="number" step="any" name="slope" required>

        <label>Elevation (metres)</label>
        <input type="number" step="any" name="elevation" required>

        <label>Temperature (°C)</label>
        <input type="number" step="any" name="temperature" required>

        <label>Past Landslide Events</label>
        <input type="number" name="past_events" required>

        <button type="submit">🔍 Predict Landslide Risk</button>

    </form>

    {% if prediction %}
    <div class="result">
        Prediction: {{ prediction }}
    </div>
    {% endif %}

</div>

</body>
</html>
